Add new entry==新增項目
This section allows you to build custom "Bothers".==這個區塊讓你可以建立自訂的「Bothers」。
Many bothers are very simple, consisting of a single callback parameter to a given addon when it appears. This is for those types of bothers.==許多 Bothers 都很簡單，只需在指定的 Addon 出現時，傳送單一回呼（callback）參數即可。這裡就是設定這類 Bothers 的地方。
Callback parameter parsing works the same as in Something Need Doing.==回呼參數的解析方式與 Something Need Doing 相同。
Custom bothers are registered via AddonLifeCycle on the PostSetup event.==自訂 Bothers 是透過 AddonLifeCycle 在 PostSetup 事件中註冊的。
Some bothers may require infeasible parameters, waits, or different AddonEvents. Those can still be requested for the normal bother system.==有些 Bothers 可能需要不易實現的參數、等待時間或不同的 AddonEvent，這類需求仍可向一般的 Bothers 系統提出請求。
Example:==範例：
Effect: When opening the Character addon, it will instantly be closed. Probably not useful.==效果：開啟角色（Character）Addon 時，會立即將其關閉。大概沒什麼用處。
Note:==備註：
This is not used for anything, it's just a note to help remember what this bother does.==此欄位不會用於任何判斷，只是用來幫助記住這個 Bother 的用途。
Addon Name:==Addon 名稱：
Parameters:==參數：
Add last selected as new entry==將最近選擇的內容新增為項目
Enter into the input all or part of the text inside a line in a list dialog.==在輸入框中輸入清單對話框中某一列文字的全部或部分內容。
For example: "Purchase a Mini Cactpot ticket" in the Gold Saucer.==例如：黃金水都中可輸入「Purchase a Mini Cactpot ticket」。
Alternatively, wrap your text in forward slashes to use as a regex.==也可以將文字用斜線包起來作為正規表示式使用。
As such: "/Purchase a .*? ticket/"==如："/Purchase a .*? ticket/"
If any line in the list matches, then that line will be chosen.==若清單中任一列符合，該列即會被選擇。
Right click a line to view options.==右鍵點擊一列可檢視選項。
Double click an entry for quick enable/disable.==雙擊項目可快速啟用/停用。
Ctrl-Shift right click a line to delete it and any children.==Ctrl-Shift 右鍵點擊一列可刪除該項目及其子項目。
