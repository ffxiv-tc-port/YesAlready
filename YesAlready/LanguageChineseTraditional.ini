Enter into the input all or part of the selected taret name while in a talk dialog.==在輸入框中輸入對話視窗中所選目標名稱的全部或部分內容。
For example: "Moyce" in the Crystarium.==例如：水晶都可輸入「Moyce」。
As such: "/(Moyce|Eirikur)/"==如："/(Moyce|Eirikur)/"
To skip your retainers, add the summoning bell.==若要略過你的僱員，請加入召喚鈴。
Invalid Target Regex==無效的目標正規表示式
For example: "Teleport to " for the teleport dialog.==例如：傳送對話框可輸入「Teleport to 」。
As such: "/Teleport to .*? for \d+(,\d+)? gil\?/"==如："/Teleport to .*? for \d+(,\d+)? gil\?/"
Or simpler: "/Teleport to .*?/" (and hope it doesn't match something unexpected)==或更簡單："/Teleport to .*?/"（但要注意可能意外符合到其他內容）
If it matches, the yes button (and checkbox if present) will be clicked.==若符合，會自動點擊「是」按鈕（如有勾選框則一併勾選）。
Shift-Click to add to a new or first existing folder with the current zone name, restricted to that zone.==Shift-點擊：新增到以目前區域名稱命名的新（或既有）資料夾，並限制在該區域內。
