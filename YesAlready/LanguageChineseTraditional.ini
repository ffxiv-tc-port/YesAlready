Enter into the input all or part of the text inside a dialog.==在輸入框中輸入對話框內文字的全部或部分內容。
For example: "Remove how many from stack?" for the split stack dialog.==例如：拆分堆疊對話框可輸入「Remove how many from stack?」。
As such: "/Remove .*/"==如："/Remove .*/"
If it matches, the ok button will be clicked.==若符合，會自動點擊確定按鈕。
